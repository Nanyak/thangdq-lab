[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stuffsy-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "openai>=1.30.0",
    "langchain>=0.2.17",
    "langchain-openai>=0.1.25",
    "qdrant-client[fastembed]>=1.9.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.9.0",
    "boto3>=1.34.0",
    "redis[asyncio]>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
